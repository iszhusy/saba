name = "saba"
main = "src/api/handler.ts"
compatibility_date = "2024-01-01"

[site]
bucket = "./public"

[[kv_namespaces]]
binding = "ASSESSMENTS_KV"
id = "your-kv-namespace-id"

[[d1_databases]]
binding = "D1_DATABASE"
database_name = "saba-db"
# 本地 dev 可用占位 id；部署前请 wrangler d1 create 并替换为真实 database_id
database_id = "your-database-id"
